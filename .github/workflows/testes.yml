# Testes de lógica a cada push e PR: motor, validação, checagens, labs.
# No GitHub não roda processamento (27/11/2026): sem LibreOffice, sem gerar Word/PDF, sem exemplo de ponta a ponta.
# Os testes que geram PDF se pulam sozinhos aqui (skipUnless soffice) e rodam no computador.
name: testes

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install -r esteira/requirements.txt

      - name: Testes
        run: python -m unittest discover -s tests -v
